name: Build for intellij-cucumber-scala

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Compile & Test
        env:
          # Hosted Ubuntu restricts the user namespaces required by Chromium's sandbox.
          JAVA_TOOL_OPTIONS: -Dide.browser.jcef.sandbox.enable=false
        run: xvfb-run -a sbt --batch test
